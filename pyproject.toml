[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "2.0.0"
description = "Runtime for GitHub-Actions-hosted autonomous agents: workspace, heartbeat, mission, provider-neutral LLM loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
dev = ["pytest>=8", "openai>=1.60"]

[project.scripts]
agent-cycle = "agent_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
